name: ci

on:
  push:
    branches:
      - "**"
    tags:
      - "nuget_*"
  pull_request:

jobs:
  native:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64, x86]
    steps:
      - uses: actions/checkout@v4
      - name: Build native ${{ matrix.arch }}
        shell: pwsh
        run: |
          $args = @("-ExecutionPolicy", "Bypass", "-File", "build\native-windows-cmake.ps1", "-TargetArch", "${{ matrix.arch }}")
          if ("${{ matrix.arch }}" -ne "x64") {
            $args += "-SkipTests"
          }
          powershell @args
      - uses: actions/upload-artifact@v4
        with:
          name: native-win-${{ matrix.arch }}
          path: src/Guance.Windows.Native/bin/win-${{ matrix.arch }}/guance_windows_native.dll

  managed:
    runs-on: windows-2022
    needs: native
    outputs:
      package-version: ${{ steps.release-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/download-artifact@v4
        with:
          name: native-win-x64
          path: src/Guance.Windows.Native/bin/win-x64
      - uses: actions/download-artifact@v4
        with:
          name: native-win-arm64
          path: src/Guance.Windows.Native/bin/win-arm64
      - uses: actions/download-artifact@v4
        with:
          name: native-win-x86
          path: src/Guance.Windows.Native/bin/win-x86
      - run: dotnet restore Guance.Windows.sln
      - run: dotnet test tests/Guance.Windows.Tests/Guance.Windows.Tests.csproj -c Release
      - run: dotnet build src/Guance.Windows/Guance.Windows.csproj -c Release -f net6.0
      - run: dotnet build src/Guance.Windows/Guance.Windows.csproj -c Release -f net6.0-windows10.0.17763.0
      - name: Resolve release version
        id: release-version
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = ""
          if ($env:REF_TYPE -eq "tag") {
            $version = & .\build\resolve-release-tag.ps1 `
              -Tag $env:REF_NAME `
              -ExpectedKind nuget `
              -CheckChangelog
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Pack, verify, and consumer smoke
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $packArgs = @(
            "-ExecutionPolicy", "Bypass",
            "-File", "build\pack.ps1",
            "-OutputDirectory", "dist",
            "-SkipTests")
          if ($env:REF_TYPE -eq "tag") {
            $packArgs += @("-ReleaseTag", $env:RELEASE_TAG)
          }
          powershell @packArgs
      - uses: actions/upload-artifact@v4
        with:
          name: managed-package
          path: |
            dist/*.nupkg
            dist/*.snupkg
            dist/release-manifest.json

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/nuget_')
    runs-on: windows-2022
    needs: managed
    environment: nuget-release
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/download-artifact@v4
        with:
          name: managed-package
          path: dist
      - name: Verify release package
        id: package
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.managed.outputs.package-version }}
        run: |
          $version = $env:PACKAGE_VERSION
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Managed release version output is empty."
          }
          $package = Join-Path "dist" "Guance.Windows.$version.nupkg"
          $symbols = Join-Path "dist" "Guance.Windows.$version.snupkg"
          if (-not (Test-Path -LiteralPath $package)) {
            throw "Expected release package was not found: $package"
          }
          if (-not (Test-Path -LiteralPath $symbols)) {
            throw "Expected symbol package was not found: $symbols"
          }
          "path=$((Resolve-Path -LiteralPath $package).Path)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish NuGet package
        shell: pwsh
        run: >
          dotnet nuget push
          "${{ steps.package.outputs.path }}"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --symbol-api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source "https://api.nuget.org/v3/index.json"
